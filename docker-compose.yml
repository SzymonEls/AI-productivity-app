# One file for every deployment. What an instance is - private or a public
# read-only demo - is decided by instance/.env, not by this file.
#
# Two different .env files are involved, and mixing them up is the usual cause
# of "it ignores my settings":
#   ./.env               read by Compose, only to fill in ${...} below
#   ./instance/.env      read by the application itself (mounted into it)
services:
  web:
    build:
      context: https://github.com/SzymonEls/AI-productivity-app.git#main
    # Fixed name, because it is also the hostname the reverse proxy connects to.
    # Left to Compose it would be derived from the directory AND the Compose
    # version - productivity_web_1 on v1, productivity-web-1 on v2 - so an
    # upgrade of the docker CLI silently breaks the proxy. Override per instance
    # with INSTANCE_NAME in the .env file next to this one.
    container_name: ${INSTANCE_NAME:-productivity}
    restart: unless-stopped
    user: "0:0"
    environment:
      FLASK_ENV: production
      SKIP_DB_BOOTSTRAP: "1"
      # Set here as well as in .env, because an .env left over from an older
      # deployment still names /app/app/instance - a path nothing mounts any more.
      # Environment variables win over the file, so this keeps such an instance
      # pointed at the real database.
      DATABASE_URL: sqlite:////app/instance/app.db
    # No published port: the reverse proxy shares the reverse_proxy network and
    # reaches the container by name on port 8000. Publishing one would only
    # collide with the other instance on the host. Add a mapping such as
    # "8010:8000" if your proxy runs on the host instead of in a container.
    volumes:
      # /app is the repository root, and config.py reads .env and the database
      # from the instance directory beside the code rather than inside it.
      - ./instance:/app/instance
    networks:
      - reverse_proxy

networks:
  reverse_proxy:
    driver: bridge
    external: true
