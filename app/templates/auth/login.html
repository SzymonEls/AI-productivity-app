{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="{% if demo_mode %}col-md-8 col-lg-6{% else %}col-md-6 col-lg-5{% endif %}">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Login</h1>
                <form method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ default_login_email }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" value="{{ default_login_password }}" required>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
                        <label class="form-check-label" for="remember_me">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                {% if registration_enabled %}
                    <p class="mt-3 mb-0 text-muted">
                        Need an account?
                        <a href="{{ url_for('auth.register') }}">Register here</a>.
                    </p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% if demo_mode and demo_doc_html %}
<div class="row justify-content-center mt-4">
    <div class="col-md-10 col-lg-9">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 mb-4">About the project</h2>
                <div class="demo-doc">
                    {{ demo_doc_html }}
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
{% endblock %}
