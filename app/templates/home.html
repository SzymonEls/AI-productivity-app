{% extends "base.html" %}
{% from "icons.html" import icon %}

{% block title %}Home{% endblock %}

{#
  One definition of an inbox row, rendered twice: once per item that is already
  waiting, and once more into a <template> the + clones when it adds one without
  a reload. A second copy of this markup in JavaScript would have to carry the
  whole project list with it, and the two would drift the first time the picker
  changed.
#}
{% macro inbox_row(item=None) %}
<li class="inbox-item" data-inbox-item{% if item %} data-item-id="{{ item.id }}"{% endif %}>
    <div class="inbox-item-head">
        <p class="inbox-item-text mb-0" data-inbox-text>{{ item.body if item else "" }}</p>
        {# The way out for a thought that should not be filed anywhere. Capture
           is deliberately careless - one tap and a sentence, nothing asked and
           nothing checked - so the misfires need somewhere to go that is not a
           real project. #}
        <button
            type="button"
            class="icon-button inbox-item-remove"
            data-inbox-remove
            title="Remove this thought"
            aria-label="Remove the thought &ldquo;{{ item.body if item else '' }}&rdquo; from the inbox"
        >{{ icon("x") }}</button>
    </div>
    <select
        class="form-select form-select-sm inbox-item-project"
        data-inbox-project
        aria-label="File this thought under a project"
        {% if not inbox_projects %}disabled{% endif %}
    >
        <option value="" selected>{% if inbox_projects %}Move to project&hellip;{% else %}No projects yet{% endif %}</option>
        {% for project in inbox_projects %}
            <option value="{{ project.id }}">{{ project.title }}</option>
        {% endfor %}
    </select>
</li>
{% endmacro %}

{% block content %}
<div class="dashboard-page day-slots-page">
    <section class="dashboard-section dashboard-header-section">
        <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
            <div class="d-flex align-items-center gap-2">
                <h1 class="h5 mb-0">Today</h1>
                <span class="text-muted small">{{ today.strftime("%A, %d %B") }}</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                {# Here rather than on the inbox widget itself: the widget is gone
                   whenever the inbox is empty, which is exactly when you are most
                   likely to want to put something in it. #}
                <button type="button" class="btn btn-outline-secondary btn-sm inbox-add" data-inbox-add>
                    {{ icon("plus", 14) }} Inbox
                </button>
            </div>
        </div>
        {# Revealed in place rather than in a dialog: capturing a thought is one
           box and one key, and the same gesture the day notes use. #}
        <form class="inbox-capture" data-inbox-capture hidden>
            <textarea
                class="form-control form-control-sm"
                data-inbox-capture-field
                rows="2"
                maxlength="2000"
                placeholder="A thought to file later&hellip;"
                aria-label="A thought to put in the inbox"
            ></textarea>
            <div class="inbox-capture-controls">
                <button type="submit" class="btn btn-primary btn-sm">Add</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-inbox-capture-cancel>Cancel</button>
            </div>
        </form>
    </section>

    <div class="day-slots-layout">
        <section class="day-slots-main">
            {% for card in slot_cards %}
                {% set is_optional = card.slot not in timed_slots %}
                <article class="slot-card slot-card-linked{% if is_optional %} slot-card-optional{% endif %}{% if not card.project %} slot-card-empty{% endif %}{% if card.is_done %} slot-card-done{% endif %}">
                    <div class="slot-card-letter" aria-hidden="true">{{ card.slot }}</div>
                    <div class="slot-card-body">
                        {% if card.project %}
                            <div class="slot-card-heading">
                                {# stretched-link makes the whole card the hit area without
                                   wrapping the card in an anchor, which would turn the time
                                   and the badges into link text for a screen reader. #}
                                <a class="slot-card-title stretched-link" href="{{ url_for('projects.project_detail', project_id=card.project.id) }}">
                                    {{ card.project.title }}
                                </a>
                                {% if card.project.is_starred %}<span class="switcher-badge" title="Starred" aria-hidden="true">★</span>{% endif %}
                                {# No padlock: a private project is one nobody looking over your
                                   shoulder should be able to pick out of today's three cards.
                                   Privacy shows on the project's own page instead, where the plan
                                   and the thoughts stay behind a button. #}
                                {% if card.is_done %}<span class="slot-done-tag">Done</span>{% endif %}
                            </div>
                            {% if card.plan_heading %}
                                <p class="slot-card-step mb-0">{{ card.plan_heading }}</p>
                            {% else %}
                                <p class="slot-card-step slot-card-step-empty mb-0">No <code>#</code> section in the plan yet</p>
                            {% endif %}
                        {% else %}
                            <p class="slot-card-step mb-0">Nothing planned &mdash; pick a project.</p>
                            {# Covers the whole card, mirroring the stretched link on a filled one. #}
                            <button
                                type="button"
                                class="slot-card-fill"
                                data-fill-slot
                                data-date="{{ today.isoformat() }}"
                                data-slot="{{ card.slot }}"
                            >
                                <span class="visually-hidden">Choose a project for slot {{ card.slot }}</span>
                            </button>
                        {% endif %}
                    </div>
                    <div class="slot-card-side">
                        {% if card.project and card.shows_time %}
                            <span class="slot-card-time">{{ card.tracked_label }}</span>
                        {% endif %}
                    </div>
                </article>
            {% endfor %}
        </section>

        <aside class="day-slots-aside">
            {# Hidden rather than absent while the inbox is empty: an empty inbox
               is nothing to report, but the + above has to be able to fill it
               without a reload, and the picker inside a row is built from the
               project list this section carries. #}
            <div class="dashboard-section inbox-widget" data-inbox {% if not inbox_items %}hidden{% endif %}>
                <h2 class="h6 mb-1">Inbox <span class="text-muted fw-normal" data-inbox-count>({{ inbox_items|length }})</span></h2>
                <p class="text-muted small mb-3">Captured without a project. Pick where each one belongs and it is appended to that project's thoughts.</p>
                <p class="inbox-status" data-inbox-status role="status"></p>
                <ul class="inbox-list" data-inbox-list>
                    {% for item in inbox_items %}{{ inbox_row(item) }}{% endfor %}
                </ul>
                <template data-inbox-row-template>{{ inbox_row() }}</template>
            </div>

            <div class="dashboard-section">
                <h2 class="h6 mb-1">Not scheduled{% if unplanned_projects %} <span class="text-muted fw-normal">({{ unplanned_projects|length }})</span>{% endif %}</h2>
                <p class="text-muted small mb-3">No session planned after today.</p>
                {% if unplanned_projects %}
                    <ul class="unplanned-list">
                        {% for project in unplanned_projects %}
                            <li class="unplanned-item">
                                <div class="unplanned-item-text">
                                    <a href="{{ url_for('projects.project_detail', project_id=project.id) }}">{{ project.title }}</a>
                                    <span class="text-muted small">{{ project_last_session_labels.get(project.id, "") }}</span>
                                </div>
                                <button
                                    type="button"
                                    class="btn btn-outline-secondary btn-sm"
                                    data-plan-session
                                    data-project-id="{{ project.id }}"
                                    data-project-title="{{ project.title }}"
                                >Plan</button>
                            </li>
                        {% endfor %}
                    </ul>
                {% else %}
                    <p class="text-muted small mb-0">Every project has a next session planned.</p>
                {% endif %}
            </div>

            <div class="dashboard-section system-health system-health-{{ health.level }}">
                <h2 class="h6 mb-1">System health</h2>
                <p class="text-muted small mb-3">How many of the sessions booked over the {{ health.window_days }} days before today were done.</p>
                {# A row per ring, one under the other, each next to its own
                   numbers. The two circles share a centre line: the planning one
                   is drawn smaller but sits in a box as wide as the score's, so
                   both rows of text start at the same place. #}
                <div class="system-health-body">
                    <div class="system-health-row">
                        {# pathLength normalises the ring to 100 units, so the dash is
                           the percentage itself and the radius can change freely. #}
                        <div class="system-health-gauge" role="img" aria-label="System health {{ health.percent }} out of 100">
                            <svg viewBox="0 0 84 84" aria-hidden="true">
                                <circle class="system-health-track" cx="42" cy="42" r="36" pathLength="100" />
                                {# At 0 there is no arc to draw, and the round cap would
                                   leave a dot on the ring that reads as a tiny score. #}
                                {% if health.percent %}
                                    <circle
                                        class="system-health-value"
                                        cx="42"
                                        cy="42"
                                        r="36"
                                        pathLength="100"
                                        style="stroke-dasharray: {{ health.percent }} 100"
                                    />
                                {% endif %}
                            </svg>
                            <span class="system-health-score">{{ health.percent }}</span>
                        </div>
                        <p class="system-health-row-text">
                            <span class="system-health-part-label">Sessions done</span>
                            <span class="system-health-part-value">{{ health.done_sessions }} / {{ health.booked_sessions }}</span>
                        </p>
                    </div>
                    <div class="system-health-row">
                        {# Planning is not in the score - having every project booked
                           ahead is the baseline, not something to be paid for - so it
                           gets a ring of its own, smaller and with no percentage in
                           it: the state is either settled or it is not. The circle is
                           always whole, so nobody reads it as a second score. #}
                        <div
                            class="system-health-planning {{ 'is-ok' if health.planning_ok else 'is-warn' }}"
                            role="img"
                            aria-label="{% if health.planning_ok %}Every project has a next session planned{% else %}{{ health.unplanned_projects }} of {{ health.active_projects }} projects have no next session planned{% endif %}"
                        >
                            <svg viewBox="0 0 44 44" aria-hidden="true">
                                <circle class="system-health-planning-ring" cx="22" cy="22" r="18" />
                            </svg>
                            {{ icon("check" if health.planning_ok else "x", 18) }}
                        </div>
                        <p class="system-health-row-text">
                            <span class="system-health-part-label">Planned ahead</span>
                            <span class="system-health-part-value">{{ health.planned_projects }} / {{ health.active_projects }}</span>
                        </p>
                    </div>
                </div>
            </div>

            {# The tags live in the plans as text and are searched for on the page
               this leads to, not here: the home page would otherwise pay for a
               list nobody may look at. #}
            <div class="dashboard-section">
                <h2 class="h6 mb-1">Tags</h2>
                <p class="text-muted small mb-3">Whatever you marked with a <code>#tag</code> in a plan's list.</p>
                <a href="{{ url_for('projects.tags_page') }}" class="btn btn-outline-secondary btn-sm">Show tags</a>
            </div>
        </aside>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/day-planner.js') }}"></script>
<script src="{{ url_for('static', filename='js/inbox.js') }}"></script>
{% endblock %}
