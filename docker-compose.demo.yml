# Public read-only demo. Runs alongside the normal instance from the same
# image; only the environment differs. Start it with:
#   docker compose -f docker-compose.demo.yml up -d
services:
  web:
    build:
      context: https://github.com/SzymonEls/AI-productivity-app.git#v1.5.0
    container_name: ai-productivity-demo
    restart: unless-stopped
    user: "0:0"
    environment:
      FLASK_ENV: production
      SKIP_DB_BOOTSTRAP: "1"
      DATABASE_URL: sqlite:////app/instance/app.db
      # Read-only demo: every POST/PUT/PATCH/DELETE is rejected, the login page
      # doubles as a landing page, and seed-demo runs at startup.
      DEMO_MODE: "1"
      DEMO_DOC_PATH: README.md
      DEMO_BANNER_MESSAGE: Read-only portfolio demo — nothing you change here is saved.
      REGISTRATION_ENABLED: "false"
      # Shown pre-filled on the login page - deliberately public.
      DEFAULT_LOGIN_EMAIL: demo@example.com
      DEFAULT_LOGIN_PASSWORD: demo
      # SECRET_KEY is left unset on purpose: docker-entrypoint.sh generates a
      # random one into ./demo-instance/.env on first boot. It must not be the
      # key used by the private instance.
      GUNICORN_WORKERS: "1"
    ports:
      - "${DEMO_APP_PORT:-8010}:8000"
    volumes:
      # Separate database from the private instance, which uses ./app/instance.
      - ./demo-instance:/app/instance
    networks:
      - reverse_proxy

networks:
  reverse_proxy:
    driver: bridge
    external: true
