[pytest]
testpaths = tests
# The tests import the application as `app`, which lives beside this file
# rather than in the directory pytest happens to be started from.
pythonpath = .
# Pytest's own cache belongs outside the source tree, next to the bytecode
# cache, rather than as a .pytest_cache in whatever directory holds the tests.
cache_dir = ~/.cache/pytest/ai-productivity-app
filterwarnings =
    ignore::DeprecationWarning
